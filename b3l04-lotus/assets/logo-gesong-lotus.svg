<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="gradLotus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Lotus & Musical Note Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Stylized Lotus Blossom -->
    <path d="M35,20 C32,28 30,38 35,52 C40,38 38,28 35,20 Z" fill="#fda4af"/>
    <path d="M35,32 C26,38 18,44 20,54 C26,56 34,50 35,46 Z" fill="#f43f5e"/>
    <path d="M35,32 C44,38 52,44 50,54 C44,56 36,50 35,46 Z" fill="#f43f5e"/>
    <!-- Lotus leaf pad -->
    <path d="M14,56 C22,60 48,60 56,56 C50,62 20,62 14,56 Z" fill="#10b981"/>
    <!-- Note Stem -->
    <circle cx="20" cy="56" r="4" fill="#f59e0b"/>
  </g>

  <!-- Main Title: 歌SONG國文 -->
  <text x="82" y="44" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="34" font-weight="900" fill="url(#gradText)" letter-spacing="1.5">
    歌SONG國文
  </text>

  <!-- Capsule Badge: B3L04・愛蓮說 -->
  <rect x="270" y="24" width="82" height="22" rx="11" fill="#7c2d12" stroke="#fdba74" stroke-width="1.2"/>
  <text x="311" y="39" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#fff7ed" text-anchor="middle">
    L04・愛蓮說
  </text>

  <!-- Subtitle -->
  <text x="84" y="64" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    獨愛幽香出淤泥・品味君子風骨與生命的文學交響
  </text>
</svg>